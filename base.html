<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}F1 Race Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="brand">F1 Race Intelligence</div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('story') }}" class="{{ 'on' if page == 'story' }}">Story</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Data: 6,464 race outcomes across 17 seasons. Built with Tableau Public and Flask.
  </footer>
</body>
</html>
