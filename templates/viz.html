{% extends "base.html" %}
{% block title %}{{ heading }} | F1 Race Intelligence{% endblock %}

{% block content %}
<section class="intro">
  <h1>{{ heading }}</h1>
  <p>{{ intro }}</p>
  <a class="open" href="{{ open_link }}" target="_blank" rel="noopener">Open on Tableau Public</a>
</section>

<div class="frame">
  <tableau-viz
    id="tableauViz"
    src="{{ src }}"
    width="1400"
    height="{{ height }}"
    toolbar="bottom"
    hide-tabs>
  </tableau-viz>
</div>

<script type="module"
  src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js">
</script>
{% endblock %}
